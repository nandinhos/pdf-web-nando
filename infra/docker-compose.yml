name: pdf-web-nando

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../infra/backend.Dockerfile
    environment:
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-500}
      MAX_PAGES_PER_OP: ${MAX_PAGES_PER_OP:-2000}
      STORAGE_LOCAL_DIR: /tmp/pdfweb
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
      - minio
    expose:
      - "8081"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/frontend.Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    depends_on:
      - backend
    expose:
      - "3000"

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-8090}:80"
    depends_on:
      - backend
      - frontend

volumes:
  minio-data:
